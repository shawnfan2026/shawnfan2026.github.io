<!DOCTYPE html>
<html lang="zh-CN" data-theme="spurs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球队数据看板 · 动态换肤</title>
<style>
  :root{
    --bg:#1a1a1a;
    --accent:#c4ced4;
    --accent-rgb:196,206,212;
    --text:#f2f5f6;
    --muted:#9fa9ae;
    --card:rgba(255,255,255,.055);
    --border:rgba(196,206,212,.18);
    --chip:rgba(196,206,212,.12);
    --bg-image:linear-gradient(135deg,rgba(26,26,26,.94),rgba(26,26,26,.72)),url("https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1920&q=80");
  }
  html[data-theme="lakers"]{
    --bg:#242133;
    --accent:#fdb927;
    --accent-rgb:253,185,39;
    --text:#fbf7ef;
    --muted:#b8b2c6;
    --card:rgba(255,255,255,.055);
    --border:rgba(253,185,39,.22);
    --chip:rgba(253,185,39,.12);
    --bg-image:linear-gradient(135deg,rgba(36,33,51,.93),rgba(36,33,51,.7)),url("https://images.unsplash.com/photo-1504450758481-7338eba7524a?auto=format&fit=crop&w=1920&q=80");
  }
  html[data-theme="mancity"]{
    --bg:#00245c;
    --accent:#6cabdd;
    --accent-rgb:108,171,221;
    --text:#f2f8ff;
    --muted:#a9c4de;
    --card:rgba(255,255,255,.055);
    --border:rgba(108,171,221,.24);
    --chip:rgba(108,171,221,.14);
    --bg-image:linear-gradient(135deg,rgba(0,36,92,.92),rgba(0,36,92,.7)),url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1920&q=80");
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);transition:background-color .5s ease}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,sans-serif;
    color:var(--text);
    background:transparent;
    min-height:100vh;
    line-height:1.65;
    transition:all .5s ease;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image:var(--bg-image);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    opacity:1;
    transition:opacity .25s ease;
  }
  body.is-fading::before{opacity:0}

  .topbar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    flex-wrap:wrap;
    padding:14px clamp(18px,5vw,64px);
    background:rgba(var(--accent-rgb),.06);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:var(--accent);
    box-shadow:0 0 22px rgba(var(--accent-rgb),.45);
    position:relative;flex:none;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:9px;border-radius:4px;
    border:2px solid rgba(0,0,0,.55);border-top-color:transparent;transform:rotate(25deg);
  }
  .brand strong{display:block;font-size:15px;letter-spacing:.16em;line-height:1.2}
  .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em}

  .theme-switch{display:flex;gap:8px;flex-wrap:wrap}
  .team-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:600;letter-spacing:.04em;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    transition:all .3s ease;
  }
  .team-btn i{width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 10px var(--dot)}
  .team-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
  .team-btn.is-active{background:var(--accent);color:#141414;border-color:var(--accent)}
  .team-btn.is-active i{box-shadow:0 0 8px rgba(0,0,0,.35)}
  .team-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  main{width:min(1180px,100%);margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,5vw,40px) 48px}
  .block{
    margin-bottom:26px;padding:clamp(22px,3.4vw,38px);
    border:1px solid var(--border);border-radius:22px;
    background:var(--card);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    transition:all .5s ease;
  }
  .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--accent);text-transform:uppercase;font-weight:700}
  .intro{display:grid;grid-template-columns:1.35fr .65fr;gap:30px;align-items:center}
  .intro h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:10px 0 6px;letter-spacing:-.01em}
  .intro .en{font-size:12px;letter-spacing:.24em;color:var(--muted)}
  .intro p{margin-top:18px;color:var(--muted);max-width:60ch;font-size:15px}
  .tagline{margin-top:22px;display:inline-block;padding:8px 16px;border-radius:999px;background:var(--chip);border:1px solid var(--border);font-size:13px;color:var(--accent)}
  .identity{
    border-left:2px solid var(--accent);padding-left:20px;
  }
  .identity div{padding:10px 0;border-bottom:1px dashed var(--border)}
  .identity div:last-child{border-bottom:0}
  .identity span{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .identity b{font-size:15px;font-weight:600}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .section-head h2{font-size:21px;letter-spacing:.02em}
  .section-head em{font-style:normal;font-size:12px;color:var(--muted)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .stat-card{padding:20px;border-radius:16px;background:rgba(var(--accent-rgb),.055);border:1px solid var(--border);transition:transform .3s ease,border-color .3s ease}
  .stat-card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .stat-label{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
  .stat-value{display:block;font-size:clamp(26px,3.2vw,36px);line-height:1.2;margin:8px 0 14px;color:var(--accent);font-variant-numeric:tabular-nums}
  .stat-value small{font-size:13px;margin-left:5px;color:var(--muted);font-weight:500}
  .stat-bar{display:block;height:4px;border-radius:99px;background:rgba(var(--accent-rgb),.14);overflow:hidden}
  .stat-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease}

  .news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .news-card{padding:18px;border-radius:16px;border:1px solid var(--border);background:rgba(0,0,0,.14);transition:transform .3s ease,border-color .3s ease}
  .news-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .news-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);letter-spacing:.08em}
  .news-tag{padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--accent)}
  .news-card h3{font-size:15px;line-height:1.55;margin:12px 0 8px;font-weight:600}

  footer{text-align:center;padding:8px 20px 36px;font-size:12px;color:var(--muted)}

  @media(max-width:720px){
    .topbar{justify-content:center;text-align:center}
    .theme-switch{width:100%;justify-content:center}
    .team-btn{flex:1 1 auto;justify-content:center}
    .intro{grid-template-columns:1fr;gap:20px}
    .identity{border-left:0;border-top:2px solid var(--accent);padding:14px 0 0}
  }
  @media(prefers-reduced-motion:reduce){
    body,body::before,.block,.stat-card,.news-card,.team-btn{transition:none}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>TEAM PULSE</strong><small>球队数据看板</small></div>
    </div>
    <nav class="theme-switch" aria-label="主题切换">
      <button class="team-btn is-active" type="button" data-theme-set="spurs" aria-pressed="true" style="--dot:#c4ced4"><i></i>马刺队</button>
      <button class="team-btn" type="button" data-theme-set="lakers" aria-pressed="false" style="--dot:#fdb927"><i></i>湖人队</button>
      <button class="team-btn" type="button" data-theme-set="mancity" aria-pressed="false" style="--dot:#6cabdd"><i></i>曼城</button>
    </nav>
  </header>

  <main>
    <section class="block intro">
      <div>
        <span class="eyebrow">Team Overview</span>
        <h1 id="team-name">圣安东尼奥马刺</h1>
        <div class="en" id="team-en">SAN ANTONIO SPURS</div>
        <p id="team-desc"></p>
        <span class="tagline" id="team-tagline"></span>
      </div>
      <div class="identity">
        <div><span>联盟</span><b id="meta-league"></b></div>
        <div><span>主场</span><b id="meta-arena"></b></div>
        <div><span>主色</span><b id="meta-color"></b></div>
      </div>
    </section>

    <section class="block">
      <div class="section-head">
        <div><span class="eyebrow">Key Metrics</span><h2>核心数据</h2></div>
        <em>以下为演示数据，随主题同步切换</em>
      </div>
      <div class="stats-grid" id="stats-grid"></div>
    </section>

    <section class="block">
      <div class="section-head">
        <div><span class="eyebrow">Latest News</span><h2>最新资讯</h2></div>
        <em id="news-hint"></em>
      </div>
      <div class="news-grid" id="news-grid"></div>
    </section>
  </main>

  <footer>点击顶部按钮切换球队主题 · 颜色与背景图同步过渡 · 数据仅作页面演示</footer>

<script>
  const teams = {
    spurs:{
      name:"圣安东尼奥马刺", en:"SAN ANTONIO SPURS",
      desc:"来自德克萨斯的银黑军团，以扎实的团队篮球与铁血防守闻名。传承与新生在这里交汇，主场始终是联盟最难啃的堡垒之一。",
      tagline:"银黑传承，稳如磐石",
      league:"NBA 西部", arena:"Frost Bank Center", color:"银黑 / #c4ced4",
      stats:[
        {label:"场均得分",value:"112.4",unit:"分",bar:78},
        {label:"场均篮板",value:"44.8",unit:"个",bar:72},
        {label:"防守效率",value:"110.2",unit:"",bar:80},
        {label:"主场热度",value:"86",unit:"%",bar:86}
      ],
      news:[
        {date:"11.22",tag:"球队",title:"内线统治力持续升级，马刺禁区防守排名稳步攀升"},
        {date:"11.18",tag:"数据",title:"近十场团队助攻率提升 12%，传导体系愈发流畅"},
        {date:"11.15",tag:"主场",title:"银黑之夜主题日将于下周五举行，限量周边同步发放"}
      ]
    },
    lakers:{
      name:"洛杉矶湖人", en:"LOS ANGELES LAKERS",
      desc:"紫金军团，好莱坞的灯光下永远不缺少星光。湖人以进攻天赋与关键时刻的强硬表现，持续吸引着全球球迷的目光。",
      tagline:"紫金闪耀，为胜利而战",
      league:"NBA 西部", arena:"Crypto.com Arena", color:"紫金 / #fdb927",
      stats:[
        {label:"场均得分",value:"118.6",unit:"分",bar:88},
        {label:"场均助攻",value:"27.3",unit:"次",bar:82},
        {label:"三分命中",value:"36.8",unit:"%",bar:76},
        {label:"主场热度",value:"94",unit:"%",bar:94}
      ],
      news:[
        {date:"11.23",tag:"焦点",title:"东契奇连续三场贡献 30+10，湖人进攻端火力全开"},
        {date:"11.19",tag:"阵容",title:"替补席防守强度回升，球队轮换深度得到补强"},
        {date:"11.16",tag:"主场",title:"紫金主题夜回归，主场灯光秀全新升级"}
      ]
    },
    mancity:{
      name:"曼彻斯特城", en:"MANCHESTER CITY",
      desc:"天蓝军团，以极致控球与高位压迫定义现代足球。伊蒂哈德球场的每个比赛日，都是一场精密运转的蓝色交响。",
      tagline:"天蓝信仰，掌控每一分钟",
      league:"英超联赛", arena:"Etihad Stadium", color:"天蓝 / #6cabdd",
      stats:[
        {label:"场均进球",value:"2.4",unit:"球",bar:84},
        {label:"控球率",value:"62.5",unit:"%",bar:92},
        {label:"传球成功",value:"89.1",unit:"%",bar:89},
        {label:"主场胜率",value:"78",unit:"%",bar:78}
      ],
      news:[
        {date:"11.24",tag:"英超",title:"哈兰德连续五轮破门，曼城锋线状态火热"},
        {date:"11.20",tag:"战术",title:"中场三角站位再度调整，控球节奏更加稳定"},
        {date:"11.17",tag:"主场",title:"伊蒂哈德上座率再创新高，天蓝看台氛围拉满"}
      ]
    }
  };

  const $ = id => document.getElementById(id);
  function render(theme){
    const t = teams[theme];
    $("team-name").textContent = t.name;
    $("team-en").textContent = t.en;
    $("team-desc").textContent = t.desc;
    $("team-tagline").textContent = t.tagline;
    $("meta-league").textContent = t.league;
    $("meta-arena").textContent = t.arena;
    $("meta-color").textContent = t.color;
    $("stats-grid").innerHTML = t.stats.map(s => `
      <article class="stat-card">
        <span class="stat-label">${s.label}</span>
        <strong class="stat-value">${s.value}<small>${s.unit}</small></strong>
        <span class="stat-bar"><i style="width:${s.bar}%"></i></span>
      </article>`).join("");
    $("news-grid").innerHTML = t.news.map(n => `
      <article class="news-card">
        <div class="news-meta"><span>${n.date}</span><span class="news-tag">${n.tag}</span></div>
        <h3>${n.title}</h3>
      </article>`).join("");
    $("news-hint").textContent = t.name + " · 速递";
    document.querySelectorAll(".team-btn").forEach(btn => {
      const active = btn.dataset.themeSet === theme;
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-pressed", String(active));
    });
  }

  let fadeTimer = null;
  function switchTheme(theme){
    if(document.documentElement.dataset.theme === theme) return;
    document.body.classList.add("is-fading");
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => {
      document.documentElement.dataset.theme = theme;
      render(theme);
      document.body.classList.remove("is-fading");
    }, 240);
  }

  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTheme(btn.dataset.themeSet));
  });
  render(document.documentElement.dataset.theme || "spurs");
</script>
</body>
</html>
